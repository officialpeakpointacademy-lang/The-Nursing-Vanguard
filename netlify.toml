
[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**"]

# Member portal route
[[redirects]]
  from = "/member"
  to = "/dashboard.html"
  status = 200

# Express API and application routes
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
